# gitleaks 설정 — secret-scan.yml (gitleaks/gitleaks-action@v3) 이 루트에서 자동 인식.
# 기본 룰셋(useDefault) + 이 프로젝트 고유 규칙 2개. allowlist 없음 — 어느 경로든 예외 없이 탐지.

title = "AI주식리서치 gitleaks"

[extend]
useDefault = true

# OpenDART 인증키 (40 hex). 대입문 / JSON / 인증키 파라미터 형태 모두.
[[rules]]
id = "opendart-api-key"
description = "OpenDART 40-hex key assignment or crtfc param"
regex = '''(?i)(opendart_api_key|crtfc_key)["']?\s*[=:]\s*["']?[0-9a-fA-F]{40}["']?'''
keywords = ["opendart_api_key", "crtfc_key"]

# SEC EDGAR User-Agent 컨텍스트의 실제 이메일 주소.
# 같은 줄에 SEC_EDGAR_USER_AGENT / user_agent / user-agent / "User Agent" 토큰이 있고
# 그 뒤에 이메일 형태가 오면 매칭. 각괄호 플레이스홀더처럼 골뱅이가 없는 값은 매칭되지 않는다.
[[rules]]
id = "sec-edgar-user-agent-email"
description = "Real email in a SEC EDGAR User-Agent field"
regex = '''(?i)(sec_edgar_user_agent|user[_ -]?agent)[^\n]*?[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'''
keywords = ["sec_edgar_user_agent", "user_agent", "user-agent", "user agent", "useragent"]
