# gitleaks 설정 — secret-scan.yml (gitleaks/gitleaks-action@v2) 이 루트에서 자동 인식.
# 기본 룰셋 위에 이 프로젝트 고유 키 형태(OpenDART 40-hex)를 추가하고,
# 값이 아니라 '이름'만 담은 템플릿 / 기계 생성·이미 마스킹된 산출물만 allowlist 한다.

title = "AI주식리서치 gitleaks"

[extend]
useDefault = true

[[rules]]
id = "opendart-api-key"
description = "OpenDART 인증키 (40 hex) — 대입문 또는 인증키 파라미터"
regex = '''(?i)(opendart_api_key|crtfc_key)\s*[=:]\s*["']?[0-9a-fA-F]{40}["']?'''
keywords = ["opendart_api_key", "crtfc_key"]

[allowlist]
description = "값 없는 템플릿 + 이미 _redact_meta 로 마스킹된 기계 생성 산출물 (실제 키 대입은 여전히 위 룰이 탐지)"
paths = [
  '''(^|/)data_sources/\.env\.example$''',
  '''(^|/)data_sources/store/raw/''',
  '''(^|/)web_deploy/index\.html$''',
  '''반도체_메모리_대시보드/index\.html$''',
]
regexes = [
  # .env.example 의 SEC User-Agent 예시 라인 (실제 값 아님)
  '''SEC_EDGAR_USER_AGENT=AI Stock Research your-email@example\.com''',
]
