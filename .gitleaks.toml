# gitleaks config — secret-scan.yml + (선택) 로컬에서 사용.
# 기본 룰셋 위에 이 프로젝트 고유 키 형태(OpenDART 40-hex)를 추가하고,
# 값이 아니라 '이름'만 담은 템플릿 파일만 allowlist 한다.

title = "AI주식리서치 gitleaks"

[extend]
useDefault = true

[[rules]]
id = "opendart-api-key"
description = "OpenDART 인증키 (40 hex) — 대입문 또는 crtfc_key 파라미터"
regex = '''(?i)(opendart_api_key|crtfc_key)\s*[=:]\s*["']?[0-9a-fA-F]{40}["']?'''
keywords = ["opendart_api_key", "crtfc_key"]

[allowlist]
description = "값이 없는 템플릿/예시만 허용 (실제 키가 들어오면 여전히 탐지)"
paths = [
  '''(^|/)data_sources/\.env\.example$''',
]
regexes = [
  # .env.example 의 SEC User-Agent 예시 라인 (실제 값 아님)
  '''SEC_EDGAR_USER_AGENT=AI Stock Research your-email@example\.com''',
]
