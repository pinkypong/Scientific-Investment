name: CI

# 테스트 · 빌드 검증. 전부 오프라인(--no-network 상당) — 커밋된 store/raw/ 만 사용하므로
# 시크릿이 전혀 필요 없다. 라이브 API 동기화는 data-refresh.yml 에서만.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_sources/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r data_sources/requirements.txt
          # playwright 브라우저는 CI 불필요 (hankyung_global 수집 전용)

      - name: VGS tests (value-growth-screener, stdlib only, offline)
        # VGS 는 data_sources 와 독립이고 설치가 필요 없다(표준 라이브러리만). 빨리 실패하도록 앞에 둔다.
        working-directory: value-growth-screener
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Regenerate store from committed raw/ (offline)
        # normalized·derived 는 .gitignore 대상 → 클론(체크아웃) 직후 재생성 필요.
        # 네트워크·API 키 불필요 (Phase D company cache + netguard).
        run: python -m data_sources.run_sync --all --force --no-network --force-derived

      - name: test_phase_b
        run: python -m data_sources.tests.test_phase_b

      - name: test_phase_c
        run: python -m data_sources.tests.test_phase_c

      - name: test_phase_d
        run: python -m data_sources.tests.test_phase_d

      - name: test_phase_e1
        run: python -m data_sources.tests.test_phase_e1

      - name: test_phase_e2
        run: python -m data_sources.tests.test_phase_e2

      - name: Vercel quotes function tests (node, offline)
        run: node --test scripts/test_quotes_function.mjs

      - name: build_dashboard_data --check
        run: python -m data_sources.build_dashboard_data --check

      - name: valuation.context --check
        run: python -m data_sources.valuation.context --check
