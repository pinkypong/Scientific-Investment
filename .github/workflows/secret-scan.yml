name: secret-scan

# gitleaks 공식 액션 — 개인 계정 저장소는 무료(조직 라이선스 게이트는 Organization 에만 적용).
# 루트 .gitleaks.toml 을 자동으로 읽는다. push 는 히스토리 전체, PR 은 해당 커밋 범위를 스캔.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
