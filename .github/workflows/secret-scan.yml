name: secret-scan

# gitleaks 공식 액션. 이 저장소는 개인 계정 소유 Private 이라 gitleaks 라이선스가 필요 없다
# (라이선스 게이트는 Organization 소유 저장소에만 적용). 루트 .gitleaks.toml 을 자동 인식한다.
# pull_request 는 PR 커밋 범위, push 는 히스토리를 스캔.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_SUMMARY: "true"
