[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-growth-screener"
version = "0.1.0"
description = "Objective-fact-first valuation and margin-of-safety screener"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vgs = "vgs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
